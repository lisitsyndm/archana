version: '3.8'

services:
  # PostgreSQL база данных
  postgres:
    image: pgvector/pgvector:pg15
    container_name: archana_postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-knowledge}
      POSTGRES_USER: ${DB_USERNAME:-dima}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-trooperQ@1p}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - vol1:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Python-приложение
  app:
    build: .
    container_name: archana_app
    stdin_open: true
    tty: true
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-knowledge}
      DB_USERNAME: ${DB_USERNAME:-dima}
      DB_PASSWORD: ${DB_PASSWORD:-trooperQ@1p}
    env_file:
      - .env
    volumes:
      - .:/app
    command: python main.py

  # Prometheus - сбор метрик
  prometheus:
    image: prom/prometheus:latest
    container_name: archana_prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
    restart: unless-stopped

  # Grafana - визуализация метрик
  grafana:
    image: grafana/grafana:latest
    container_name: archana_grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_ADMIN_PASSWORD:-trooperQ@3p}
      GF_SECURITY_SECRET_KEY: "archana-secret-key"
      GF_AUTH_BASIC_ENABLED: "true"
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  vol1:
  grafana_data:
